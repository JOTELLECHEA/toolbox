<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toolbox</title>
<style>
  @font-face {
    font-family: 'Big Shoulders Stencil'; font-style: normal; font-weight: 500;
    font-display: swap; src: url('fonts/big-shoulders-stencil-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Big Shoulders Stencil'; font-style: normal; font-weight: 700;
    font-display: swap; src: url('fonts/big-shoulders-stencil-latin-700-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Big Shoulders Stencil'; font-style: normal; font-weight: 800;
    font-display: swap; src: url('fonts/big-shoulders-stencil-latin-800-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400;
    font-display: swap; src: url('fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500;
    font-display: swap; src: url('fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600;
    font-display: swap; src: url('fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400;
    font-display: swap; src: url('fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500;
    font-display: swap; src: url('fonts/ibm-plex-sans-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600;
    font-display: swap; src: url('fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
  }

  :root {
    --bg: #1a1817;
    --surface: #241f1e;
    --surface-hover: #2e2725;
    --strip: #120f0e;
    --border: #453b38;
    --text: #f2ece4;
    --text-muted: #8f8580;
    --accent: #d6291a;
    --accent-soft: rgba(214, 41, 26, 0.15);
    --confirm: #5fa05a;
    --accent-amber: #c9a227;
    --accent-sage: #94a870;
    --accent-blue: #6aa9e0;
    --accent-blue-soft: rgba(106, 169, 224, 0.16);
    --font-display: "Big Shoulders Stencil", "Arial Narrow", sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  /* ---------- header ---------- */

  header {
    text-align: center;
    padding-top: 12vh;
    margin-bottom: 0;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(40px, 8vw, 64px);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }

  /* ---------- search ---------- */

  .search-row {
    position: relative;
    max-width: 560px;
    margin: 32px auto 40px;
  }

  #search {
    width: 100%;
    background: var(--strip);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 16px;
    padding: 16px 52px 16px 18px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #search::placeholder { color: var(--text-muted); }

  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .keycap {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 2px 7px;
    pointer-events: none;
  }

  /* ---------- sections ---------- */

  .eyebrow {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 34px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .eyebrow .sub {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-muted);
  }

  #results > .eyebrow:first-child { margin-top: 0; }

  /* ---------- entry card (the signature element: a die-cut bin tag) ---------- */

  .entry {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    clip-path: polygon(0 14px, 14px 0, 100% 0, 100% 100%, 0 100%);
    margin-bottom: 10px;
    padding: 14px 16px 14px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px 16px;
    align-items: center;
  }

  .entry:hover { background: var(--surface-hover); }

  .entry-desc {
    font-size: 14px;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }

  .entry-pill {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border-radius: 2px;
    margin-left: 8px;
  }

  /* Tag pills sit alongside the topic pill — filled steel blue rather than
     the topic's red, so the two read as different kinds of label at a
     glance. Blue is deliberately not one of the syntax-highlighting hues
     (amber/sage), which would otherwise imply "this is code." */
  .entry-tag {
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-blue);
    background: var(--accent-blue-soft);
    padding: 2px 7px;
    border-radius: 2px;
    margin-left: 6px;
  }

  .entry-cmd {
    font-family: var(--font-mono);
    font-size: 15px;
    background: var(--strip);
    border-radius: 2px;
    padding: 10px 12px;
    overflow-x: auto;
    white-space: pre;
  }

  /* ---------- snippet card (multi-line boilerplate) ---------- */

  .entry.snippet {
    grid-template-columns: 1fr;
    align-items: stretch;
  }

  .snippet-code {
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.55;
    background: var(--strip);
    border-radius: 2px;
    padding: 14px 16px;
    overflow-x: auto;
    white-space: pre;
    margin: 0;
  }

  .entry.snippet .copy-btn { justify-self: end; }

  /* ---------- table card ---------- */

  .entry.table-entry { grid-template-columns: 1fr; }

  .table-wrap { overflow-x: auto; }

  .entry-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    background: var(--strip);
    border-radius: 2px;
  }

  .entry-table th,
  .entry-table td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }

  .entry-table thead th {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  .entry-table tbody tr:last-child td { border-bottom: none; }

  .entry-table td code {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-blue);
  }

  .entry-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    align-items: center;
  }

  .preview-btn {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-blue);
    background: var(--accent-blue-soft);
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 10px 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .preview-btn:hover { border-color: var(--accent-blue); }

  .preview-pane {
    margin-top: 12px;
    background: #ffffff;   /* plots are drawn for light backgrounds */
    border-radius: 3px;
    padding: 10px;
    text-align: center;
  }

  .preview-img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  /* ---------- syntax highlighting (custom, matches the palette above —
     no stock hljs theme, since those clash with the red/graphite scheme) --- */

  .hljs-keyword, .hljs-number { color: var(--accent-amber); }
  .hljs-string { color: var(--accent-sage); }
  .hljs-comment { color: var(--text-muted); font-style: italic; }

  .copy-btn {
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.35);
    transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }

  .copy-btn:hover { border-color: var(--accent); }
  .copy-btn:active { transform: translateY(1px); box-shadow: none; }

  .copy-btn.copied {
    background: var(--confirm);
    color: #17240f;
    border-color: var(--confirm);
  }

  .copy-btn:focus-visible,
  #search:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- empty state ---------- */

  .empty {
    color: var(--text-muted);
    font-size: 14px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }

  .empty strong { color: var(--text); font-weight: 500; }

  #search:disabled { opacity: 0.5; cursor: wait; }

  @media (max-width: 560px) {
    .entry { grid-template-columns: 1fr; }
    .copy-btn { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Toolbox</h1>
    </header>

    <div class="search-row">
      <input id="search" type="text" autocomplete="off" spellcheck="false" disabled
             placeholder="search commands, or describe what you need &mdash; e.g. &lsquo;setup a python env&rsquo;">
      <span class="keycap">/</span>
    </div>

    <main id="results"></main>
  </div>

<script src="highlight.min.js"></script>
<script src="latex.min.js"></script>
<script>
(function () {
  const searchEl = document.getElementById("search");
  const resultsEl = document.getElementById("results");

  let topics = [];   // [{topic, file, entries: [{cmd, desc, tags, section}]}]
  let flat = [];      // flattened for search: adds topic/file onto each entry

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // Minimal inline markdown for table cells — **bold** and `code` only.
  // Escaping runs FIRST, so the tags below are the only HTML that can
  // reach the DOM; cell content can never inject markup.
  function inlineMd(s) {
    return escapeHtml(s || "")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+?)`/g, "<code>$1</code>");
  }

  function entryCard(e, showTopicPill) {
    const topicPill = showTopicPill ? `<span class="entry-pill">${escapeHtml(e.topic)}</span>` : "";
    const tagPills = (e.pills || [])
      .map((t) => `<span class="entry-tag">${escapeHtml(t)}</span>`)
      .join("");
    const pill = topicPill + tagPills;
    if (e.kind === "table") {
      const cell = (text) => inlineMd(text);
      const head = (e.header || []).map((h) => `<th>${cell(h)}</th>`).join("");
      const body = (e.rows || [])
        .map((r) => `<tr>${r.map((c) => `<td>${cell(c)}</td>`).join("")}</tr>`)
        .join("");
      return `
        <div class="entry table-entry">
          <div class="entry-desc">${escapeHtml(e.desc)}${pill}</div>
          <div class="table-wrap">
            <table class="entry-table">
              <thead><tr>${head}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          <div class="entry-actions">
            <button class="copy-btn" data-cmd="${escapeHtml(e.source || "")}">Copy table</button>
          </div>
        </div>`;
    }
    if (e.kind === "snippet") {
      const langClass = e.lang ? ` class="language-${escapeHtml(e.lang)}"` : "";
      const previewBtn = e.image
        ? `<button class="preview-btn" data-src="${escapeHtml(e.image)}">Preview</button>`
        : "";
      // The pane sits after the actions row, not inside it — otherwise the
      // image renders as a flex item wedged between the buttons.
      const previewPane = e.image ? `<div class="preview-pane" hidden></div>` : "";
      return `
        <div class="entry snippet">
          <div class="entry-desc">${escapeHtml(e.desc)}${pill}</div>
          <pre class="snippet-code"><code${langClass}>${escapeHtml(e.code)}</code></pre>
          <div class="entry-actions">${previewBtn}<button class="copy-btn">Copy snippet</button></div>
          ${previewPane}
        </div>`;
    }
    return `
      <div class="entry">
        <div class="entry-desc">${escapeHtml(e.desc)}${pill}</div>
        <div class="entry-cmd">${escapeHtml(e.cmd)}</div>
        <button class="copy-btn" data-cmd="${escapeHtml(e.cmd)}">Copy</button>
      </div>`;
  }

  function renderIdle() {
    if (topics.length === 0) {
      resultsEl.innerHTML = `<div class="empty">No sheets found yet. Add a <strong>.md</strong> file under your toolbox root and refresh.</div>`;
      return;
    }
    resultsEl.innerHTML = "";
  }

  // A query word scores higher when it matches as a whole word (bounded by
  // spaces, hyphens, or the start/end of the haystack) than when it's merely
  // a substring buried inside a longer, unrelated word — e.g. "roc" used to
  // tie with any entry mentioning "process" (p-roc-ess), and only won or
  // lost that tie by arbitrary file order. Substring matches still count
  // for something, just at half the weight, so prefix/plural cases (e.g.
  // "env" finding "environment") keep working — they just no longer
  // outrank a genuine exact word hit.
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  function wordScore(haystack, word) {
    if (!haystack.includes(word)) return 0;
    const wholeWordRe = new RegExp(`\\b${escapeRegExp(word)}\\b`);
    return wholeWordRe.test(haystack) ? 2 : 1;
  }

  function search(query) {
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (words.length === 0) { renderIdle(); return; }

    const scored = flat.map((e) => {
      // What counts as an entry's "content" depends on its kind — a table's
      // searchable text is every cell, which is the whole point of tables
      // being a real entry type rather than a fenced block.
      let content;
      if (e.kind === "snippet") content = e.code;
      else if (e.kind === "table") {
        content = [(e.header || []).join(" "), ...(e.rows || []).map((r) => r.join(" "))].join(" ");
      } else content = e.cmd;
      const haystack = `${e.desc} ${e.tags} ${e.topic} ${content}`.toLowerCase();
      const score = words.reduce((n, w) => n + wordScore(haystack, w), 0);
      return { e, score };
    }).filter((r) => r.score > 0);

    scored.sort((a, b) => b.score - a.score);

    if (scored.length === 0) {
      resultsEl.innerHTML = `<div class="empty">No match in the toolbox for &ldquo;<strong>${escapeHtml(query)}</strong>&rdquo;. Try fewer or different words.</div>`;
      return;
    }

    resultsEl.innerHTML = `
      <div class="eyebrow">Results <span class="sub">${scored.length} match${scored.length === 1 ? "" : "es"}</span></div>
      ${scored.map((r) => entryCard(r.e, true)).join("")}`;
    highlightSnippets();
  }

  function highlightSnippets() {
    if (typeof hljs === "undefined") return;  // CDN didn't load — leave code as plain text
    resultsEl.querySelectorAll(".snippet-code code").forEach((el) => hljs.highlightElement(el));
  }

  resultsEl.addEventListener("click", async (ev) => {
    const previewBtn = ev.target.closest(".preview-btn");
    if (previewBtn) {
      const pane = previewBtn.closest(".entry").querySelector(".preview-pane");
      if (!pane) return;
      // Lazy-load: the <img> isn't created until first open, so a search
      // returning many snippets doesn't fetch every preview up front.
      if (!pane.firstChild) {
        const img = document.createElement("img");
        img.src = previewBtn.dataset.src;
        img.alt = "Preview";
        img.className = "preview-img";
        img.onerror = () => { pane.textContent = "Preview image not found."; };
        pane.appendChild(img);
      }
      pane.hidden = !pane.hidden;
      previewBtn.textContent = pane.hidden ? "Preview" : "Hide preview";
      return;
    }

    const btn = ev.target.closest(".copy-btn");
    if (!btn) return;
    const isSnippet = btn.dataset.cmd === undefined;
    const idleLabel = isSnippet ? "Copy snippet" : "Copy";
    const codeEl = isSnippet ? btn.closest(".entry").querySelector("code") : null;
    const text = isSnippet ? codeEl.textContent : btn.dataset.cmd;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = "Copied";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = idleLabel; btn.classList.remove("copied"); }, 1200);
    } catch (err) {
      btn.textContent = "Select + ⌘C";
      setTimeout(() => { btn.textContent = idleLabel; }, 1500);
    }
  });

  searchEl.addEventListener("input", (ev) => search(ev.target.value));

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && document.activeElement !== searchEl) {
      ev.preventDefault();
      searchEl.focus();
    }
    if (ev.key === "Escape" && document.activeElement === searchEl) {
      searchEl.blur();
    }
  });

  fetch("/api/entries")
    .then((r) => r.json())
    .then((data) => {
      topics = data;
      flat = topics.flatMap((t) => t.entries.map((e) => ({ ...e, topic: t.topic, file: t.file })));
      renderIdle();
      searchEl.disabled = false;
      searchEl.focus();
    })
    .catch(() => {
      resultsEl.innerHTML = `<div class="empty">Couldn&rsquo;t load <strong>/api/entries</strong>. Is <strong>server.py</strong> still running?</div>`;
    });
})();
</script>
</body>
</html>
